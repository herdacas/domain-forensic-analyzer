[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "domain-forensic-analyzer"
version = "1.0.0"
description = "Terminal-based OSINT tool for domain forensic investigations"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "herdacas" }]
requires-python = ">=3.10"
keywords = ["osint", "dns", "forensics", "security", "domain", "threat-intelligence"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet :: Name Service (DNS)",
]
dependencies = [
    "requests>=2.28.0",
    "dnspython>=2.3.0",
    "urllib3>=1.26.0",
    "python-whois>=0.7.3",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pylint>=3.0.0",
]

[project.scripts]
dfa = "src.core.cli:main"

[project.urls]
Homepage = "https://github.com/herdacas/domain-forensic-analyzer"
Repository = "https://github.com/herdacas/domain-forensic-analyzer"
Issues = "https://github.com/herdacas/domain-forensic-analyzer/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[tool.setuptools.package-data]
"config" = ["settings.py"]
